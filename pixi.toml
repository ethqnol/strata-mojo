[workspace]
authors = ["Ethan Wu"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "Strata"
platforms = ["linux-64"]
version = "0.1.2"

[dependencies]
mojo = ">=1.0.0"
python = ">=3.10"
numpy = "*"
scipy = "*"

[tasks]
build = "mojo precompile strata -o strata.mojoc"
test-matrix = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack -Xlinker -lblas tests/test_matrix.mojo"
test-linalg = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack -Xlinker -lblas tests/test_linalg_advanced.mojo"
test-sparse = "mojo run -I . tests/test_sparse.mojo"
test-math = "mojo run -I . tests/test_math_and_random.mojo"
test-dataset = "mojo run -I . tests/test_dataset.mojo"
test-pipelines = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack -Xlinker -lblas tests/test_pipelines.mojo"
test-core = "mojo run -I . tests/test_traits_and_errors.mojo"
test-interop = "mojo run -I . tests/test_interop.mojo"
test-view = "mojo run -I . tests/test_view.mojo"
test-large = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack -Xlinker -lblas tests/test_large_matrix.mojo"
test-preprocessing = "mojo run -I . tests/test_preprocessing.mojo"
test-split = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack -Xlinker -lblas tests/test_model_selection.mojo"
test-model-selection = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack -Xlinker -lblas tests/test_model_selection.mojo"
test-metrics = "mojo run -I . tests/test_metrics.mojo"
test-linear-regression = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack -Xlinker -lblas tests/test_linear_regression.mojo"
test-ridge = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack -Xlinker -lblas tests/test_ridge.mojo"
test-logistic-regression = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack -Xlinker -lblas tests/test_logistic_regression.mojo"
test-decomposition = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack -Xlinker -lblas tests/test_decomposition.mojo"
test-pca = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack -Xlinker -lblas tests/test_decomposition.mojo"
test-kmeans-common = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack -Xlinker -lblas tests/test_kmeans_common.mojo"
test-kmeans = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack -Xlinker -lblas tests/test_kmeans.mojo"
test-minibatch-kmeans = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack -Xlinker -lblas tests/test_minibatch_kmeans.mojo"
test-tree-regressor = "mojo run -I . tests/test_decision_tree_regressor.mojo"
test-tree-classifier = "mojo run -I . tests/test_decision_tree_classifier.mojo"
test-tree = { depends-on = ["test-tree-regressor", "test-tree-classifier"] }
test-rf-regressor = "mojo run -I . tests/test_random_forest_regressor.mojo"
test-rf-classifier = "mojo run -I . tests/test_random_forest_classifier.mojo"
test-hist-gradient-boosting = "mojo run -I . tests/test_hist_gradient_boosting.mojo"
test-ensemble = { depends-on = ["test-rf-regressor", "test-rf-classifier", "test-hist-gradient-boosting"] }
test-neighbors = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack -Xlinker -lblas tests/test_neighbors.mojo"
test-coordinate-descent = "mojo run -I . tests/test_coordinate_descent.mojo"
test-sgd = "mojo run -I . tests/test_sgd.mojo"
test-column-transformer = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack -Xlinker -lblas tests/test_column_transformer.mojo"
test-serializer = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack -Xlinker -lblas tests/test_serializer.mojo"
test-naive-bayes = "mojo run -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack -Xlinker -lblas tests/test_naive_bayes.mojo"
test-all = { depends-on = ["test-matrix", "test-linalg", "test-sparse", "test-math", "test-dataset", "test-pipelines", "test-core", "test-view", "test-interop", "test-large", "test-preprocessing", "test-model-selection", "test-metrics", "test-linear-regression", "test-ridge", "test-logistic-regression", "test-coordinate-descent", "test-sgd", "test-decomposition", "test-kmeans-common", "test-kmeans", "test-minibatch-kmeans", "test-tree-regressor", "test-tree-classifier", "test-rf-regressor", "test-rf-classifier", "test-hist-gradient-boosting", "test-column-transformer", "test-serializer", "test-neighbors", "test-naive-bayes"] }
test = "find tests -name 'test_*.mojo' -exec mojo -I . -Xlinker -L$CONDA_PREFIX/lib -Xlinker -llapack -Xlinker -lblas {} \\;"
test-runner = "mojo run -I . scripts/run_tests.mojo"
test-seq = "mojo run -I . scripts/run_tests.mojo --single-threaded"
format = "mojo format strata tests"
format-check = "mojo format strata tests && git diff --exit-code -- strata tests"
ci = { depends-on = ["format-check", "build", "test-all"] }
generate-docs = "python scripts/generate_docs.py"
generate-sitemap = "python scripts/generate_sitemap.py"
build-docs = { depends-on = ["generate-docs", "generate-sitemap"] }
serve-docs = "pixi run build-docs && python -m http.server 8000 --directory docs"
pre-pr = { depends-on = ["format", "build", "test-runner", "generate-docs", "generate-sitemap"] }
benchmark = "python benchmarks/runner.py --suite all --scale small"
benchmark-quick = "python benchmarks/runner.py --suite all --scale quick"
benchmark-medium = "python benchmarks/runner.py --suite all --scale medium"
benchmark-large = "python benchmarks/runner.py --suite all --scale large"
benchmark-linear = "python benchmarks/runner.py --suite linear"
benchmark-trees = "python benchmarks/runner.py --suite trees"
benchmark-clustering = "python benchmarks/runner.py --suite clustering"
benchmark-neighbors = "python benchmarks/runner.py --suite neighbors"
benchmark-preprocessing = "python benchmarks/runner.py --suite preprocessing"
benchmark-linalg = "python benchmarks/runner.py --suite linalg"
