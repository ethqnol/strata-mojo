name: CI

on:
  push:
    branches: [main, "v*", "release/**"]
  pull_request:
    branches: [main, "v*", "release/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pixi Environment
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          cache: true

      - name: Verify Mojo Formatting
        run: pixi run format-check

  build:
    name: Package Precompilation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pixi Environment
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          cache: true

      - name: Precompile Strata Package
        run: pixi run build

  docs-check:
    name: Documentation & Sitemap Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pixi Environment
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          cache: true

      - name: Build Documentation
        run: pixi run build-docs

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pixi Environment
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          cache: true

      - name: Run Full Test Suite
        run: pixi run test-runner
